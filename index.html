<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Links</title>
<style>
:root{
  --bg:#21170f;--panel:#2d2116;--panel2:#382719;--gold:#d9a52e;--gold2:#f2cc63;
  --cream:#fff5dc;--muted:#b9a587;--line:#57412a;--shadow:0 18px 50px #100b0780;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]){
    --bg:#faf3e4;--panel:#fffaf0;--panel2:#fdf0d5;--gold:#b5791a;--gold2:#8c5d1c;
    --cream:#2b1a08;--muted:#7a5f3d;--line:#e3cd9e;--shadow:0 10px 30px #d9b86a30;
    color-scheme: light;
  }
}
:root[data-theme="light"]{
  --bg:#faf3e4;--panel:#fffaf0;--panel2:#fdf0d5;--gold:#b5791a;--gold2:#8c5d1c;
  --cream:#2b1a08;--muted:#7a5f3d;--line:#e3cd9e;--shadow:0 10px 30px #d9b86a30;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 12% 0%,#72501d33 0,transparent 35%),var(--bg);
  color:var(--cream);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}

button{cursor:pointer;border:0;font:inherit}

.topnav{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 18px;
  background:linear-gradient(150deg,var(--panel),var(--panel2));
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow);
}
.topnav .label{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700;margin-right:4px}
.tab{
  padding:10px 16px;border-radius:12px;background:#4a352133;color:var(--cream);
  border:1px solid var(--line);transition:.15s;font-size:13px;font-weight:600;
}
.tab:hover{filter:brightness(1.12);transform:translateY(-1px)}
.tab.active{background:linear-gradient(130deg,var(--gold2),var(--gold));color:#271809;border-color:transparent;font-weight:750}

.openext{
  margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:10px;
}
.openext:hover{color:var(--cream);border-color:var(--gold)}

.frame-wrap{height:calc(100vh - 68px);width:100%}

.gate{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:20px;text-align:center;
}
.gate h2{margin:0;color:var(--cream);font-size:20px;font-weight:650}
.gate p{margin:0;color:var(--muted);font-size:13px;max-width:300px}
.gate form{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px}
.gate input{padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--cream);outline:none;font-size:14px}
.gate input:focus{border-color:var(--gold)}
.gate .unlock{padding:11px 13px;border-radius:10px;background:linear-gradient(130deg,var(--gold2),var(--gold));color:#271809;font-weight:750}
.gate .err{color:#f18b71;font-size:12px;min-height:16px}
iframe{width:100%;height:100%;border:0;display:block;background:var(--panel)}

.placeholder{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--muted);text-align:center;padding:20px;
}
.placeholder h2{margin:0;color:var(--cream);font-size:20px;font-weight:650}
.placeholder p{margin:0;font-size:13px;max-width:360px}

@media(max-width:600px){
  .topnav{padding:11px 12px;gap:7px}
  .tab{padding:9px 12px;font-size:12px}
  .openext .label-text{display:none}
}
</style>
</head>
<body>

<div class="topnav">
  <span class="label">LINKS</span>
  <button class="tab" data-key="google" data-url="https://akungoog.vercel.app">Password Google</button>
  <button class="tab" data-key="threads" data-url="https://pxnulishandal.vercel.app">Threads</button>
  <button class="tab" data-key="kalendre" data-url="https://kalendre.vercel.app">Kalendre</button>
  <button class="tab" data-key="notion" data-url="https://notionlo.vercel.app">Notion</button>
  <button class="tab" data-key="pxnulis" data-url="https://pxnulis.vercel.app" data-gate="true">Pxnulis</button>
  <a class="openext" id="openExt" href="#" target="_blank" rel="noopener">
    <span class="label-text">Open in new tab</span> ↗
  </a>
</div>

<div class="frame-wrap" id="frameWrap">
  <div class="placeholder" id="placeholder">
    <h2>Pick a link above</h2>
    <p>Choose one of the buttons in the top bar to load it here. Some sites may block embedding and only open properly in a new tab — the "Open in new tab" link always works as a fallback.</p>
  </div>
</div>

<script>
const tabs = document.querySelectorAll('.tab');
const frameWrap = document.getElementById('frameWrap');
const openExt = document.getElementById('openExt');

const unlocked = new Set();
try {
  tabs.forEach(t => {
    if (t.dataset.gate === 'true' && sessionStorage.getItem('unlocked_' + t.dataset.key)) {
      unlocked.add(t.dataset.key);
    }
  });
} catch {}

function renderFrame(url){
  frameWrap.innerHTML = '';
  const f = document.createElement('iframe');
  f.src = url;
  f.referrerPolicy = 'no-referrer';
  frameWrap.appendChild(f);
}

function renderGate(key, url){
  frameWrap.innerHTML =
    '<div class="gate">' +
      '<h2>Locked</h2>' +
      '<p>Enter the ID and password to open this link.</p>' +
      '<form id="gateForm">' +
        '<input type="text" id="gateId" placeholder="ID" autocomplete="off">' +
        '<input type="password" id="gatePass" placeholder="Password" autocomplete="off">' +
        '<button type="submit" class="unlock">Unlock</button>' +
        '<div class="err" id="gateErr"></div>' +
      '</form>' +
    '</div>';
  document.getElementById('gateForm').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('gateId').value.trim();
    const pass = document.getElementById('gatePass').value;
    if (id === 'bongkar' && pass === 'bongkar') {
      unlocked.add(key);
      try { sessionStorage.setItem('unlocked_' + key, '1'); } catch {}
      renderFrame(url);
    } else {
      document.getElementById('gateErr').textContent = 'Incorrect ID or password.';
    }
  });
}

function selectTab(btn){
  tabs.forEach(t => t.classList.toggle('active', t === btn));
  const url = btn.dataset.url;
  const key = btn.dataset.key;
  const needsGate = btn.dataset.gate === 'true';

  openExt.href = url;

  if (needsGate && !unlocked.has(key)) {
    renderGate(key, url);
  } else {
    renderFrame(url);
  }
}

tabs.forEach(btn => btn.addEventListener('click', () => selectTab(btn)));

selectTab(document.querySelector('.tab[data-key="pxnulis"]'));
</script>

</body>
</html>
